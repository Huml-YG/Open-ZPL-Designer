# Label printing configuration. Re-read on every request - no restart needed.

[printer]
host = "192.168.101.141"   # GoDEX G530 IP address (see printer self-test / config page)
port = 9100             # raw printing port
dpi = 300               # G530 = 300 dpi (G500 would be 203)
# Optional fine-tuning; leave commented out to use the printer's own settings.
# darkness = 15         # ^MD: -30..30 relative darkness
# speed = 3             # ^PR: inches per second

[label]
# Physical label stock AS IT PASSES THE PRINT HEAD:
# width = across the head, height = in the feed direction.
stock_width_mm = 90
stock_height_mm = 50
corner_radius_mm = 1.0   # rounded label corners - shown in the designer only

# The design is always laid out in portrait (short side on top).
# rotate = clockwise degrees applied to the design to fit the stock.
#   stock 90 wide x 50 long  -> rotate = 90 (or 270 to flip it)
#   stock 50 wide x 90 long  -> rotate = 0
rotate = 270

# The print is sent exactly label-wide and the printer centres it itself.
# Offsets: shift the whole print if it still lands off-centre on the label.
# Directions are as you read the finished (portrait) label, regardless of rotate.
# Positive shift_down moves everything down; negative moves it up. Same for shift_right.
# Measured 2026-11-13 with the ruler (rotate = 270): ruler x=0 (= label top)
# sat 3 mm inside the label, y=0 (= label right edge) 0.5 mm inside.
# Test print with lines on the 3 mm margin then showed top 2.0 mm / bottom
# 3.7 mm, so moved down by the average error (0.85 mm): -3.0 -> -2.15.
shift_down_mm = -2.15
shift_right_mm = 0.5

# The editor shows an arrow at the label edge that leaves the printer first,
# worked out from rotate (the G530 ejects the bottom of its image first).
# Only for a printer that feeds the other way round: set this to true.
feed_flip = false

[layout]
margin_mm = 3.0         # safe-margin guide shown in the designer (keeps clear of the unprintable top strip, see shift_down_mm)

[fonts]
# Font for the calibration ruler print (the designer uses assets/fonts/*).
# .ttf path (relative to this folder), or empty to auto-detect DejaVu Sans.
# DM Sans is a variable font: one file, weight chosen below (100-1000;
# 400 = Regular, 500 = Medium, 600 = SemiBold, 700 = Bold).
regular = "assets/fonts/DMSans.ttf"
bold = "assets/fonts/DMSans.ttf"
regular_weight = 400
bold_weight = 700

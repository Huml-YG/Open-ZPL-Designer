# Label printing configuration. Re-read on every request - no restart needed.

[printer]
host = "192.168.101.141"   # GoDEX G530 IP address (see printer self-test / config page)
port = 9100             # raw printing port
dpi = 300               # G530 = 300 dpi (G500 would be 203)
head_width_mm = 105.7   # max print width of the G530 (4.16")
# Optional fine-tuning; leave commented out to use the printer's own settings.
# darkness = 15         # ^MD: -30..30 relative darkness
# speed = 3             # ^PR: inches per second

[label]
# Physical label stock AS IT PASSES THE PRINT HEAD:
# width = across the head, height = in the feed direction.
stock_width_mm = 90
stock_height_mm = 50

# The design is always laid out in portrait (short side on top).
# rotate = clockwise degrees applied to the design to fit the stock.
#   stock 90 wide x 50 long  -> rotate = 90 (or 270 to flip it)
#   stock 50 wide x 90 long  -> rotate = 0
rotate = 270

# Where the label's edge sits on the printer's x axis (across the head).
# Read it off the "Print calibration ruler" label: the x value at the label's
# left edge (measured 2026-11-13: label spans x = 0.7 .. 90.7 mm).
head_offset_mm = 0.7

# Fine calibration: shift the whole print if it is off-centre on the label.
# Directions are as you read the finished (portrait) label, regardless of rotate.
# Positive shift_down moves everything down; negative moves it up. Same for shift_right.
shift_down_mm = 0.0
shift_right_mm = 0.0

[layout]
margin_mm = 2.5
logo_max_height_mm = 16
logo_dither = false     # true = Floyd-Steinberg (photos), false = hard threshold (logos)
title_size_mm = 6.0     # starting font sizes; text shrinks automatically to fit
subtitle_size_mm = 3.8
details_size_mm = 3.0
qr_size_mm = 22
caption_size_mm = 2.4

[fonts]
# Leave empty to auto-detect DejaVu Sans via fontconfig, or set a .ttf path.
regular = ""
bold = ""
